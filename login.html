
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55, #6c9bbd);
            min-height: 100vh;
            margin: 0;
            padding: 20px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            width: 85px;
            height: 85px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        h2 {
            color: #243b55;
            margin: 5px 0 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            color: #333;
            margin: 15px 0 7px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #243b55;
            box-shadow: 0 0 5px rgba(36, 59, 85, 0.3);
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 15px 0;
            font-size: 14px;
            color: #555;
        }

        .remember input {
            accent-color: #243b55;
        }

        .remember label {
            margin: 0;
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #141e30;
        }

        .forgot {
            margin-top: 18px;
            font-size: 13px;
        }

        .forgot a {
            color: #243b55;
            text-decoration: none;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        .footer {
            color: #777;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .login-box {
                padding: 25px 20px;
            }

            h2 {
                font-size: 24px;
            }

            .logo {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <img src="lauren.jpg" alt="Logo" class="logo">

        <h2>Welcome Back!</h2>
        <p class="subtitle">Please log in to your account</p>

        <form onsubmit="return validateForm()">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <div class="remember">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember me</label>
            </div>

            <button type="submit">Log In</button>

            <div class="forgot">
                <a href="#" onclick="alert('Please contact the administrator to reset your password.'); return false;">
                    Forgot password?
                </a>
            </div>

        </form>

        <div class="footer">
            &copy; 2026 Arnel's Page. All rights reserved.
        </div>

    </div>

    <script>
        function validateForm() {
            var username = document.getElementById("username").value.trim();
            var password = document.getElementById("password").value;

            var validUsername = "arnel";
            var validPassword = "12345";

            if (username === validUsername &&
                password === validPassword) {

                window.location.href = "index.html";
                return false;

            } else {
                alert("Invalid username or password!");
                return false;
            }
        }
    </script>

</body>
</html>
