
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px 15px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0a4ece, #e0e7ee);
        }

        .previous {
            display: inline-block;
            padding: 10px 20px;
            background: #f1f1f1;
            color: #243b55;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }

        .previous:hover {
            background: #243b55;
            color: white;
            transform: translateX(-3px);
        }

        h1 {
            font-size: 40px;
            margin: 35px 0 25px;
            letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            color: white;
        }

        .about-box {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 35px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 18px;
            background: lightblue;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .about-box p {
            font-size: 18px;
            line-height: 1.9;
            color: #222;
            margin: 0;
        }

        /* Tablet */
        @media screen and (max-width: 768px) {
            h1 {
                font-size: 34px;
            }

            .about-box {
                max-width: 550px;
                padding: 28px;
            }

            .about-box p {
                font-size: 17px;
            }
        }

        /* Mobile */
        @media screen and (max-width: 480px) {
            body {
                padding: 15px;
            }

            h1 {
                font-size: 29px;
                margin: 30px 0 20px;
            }

            .about-box {
                padding: 22px 18px;
                border-radius: 14px;
            }

            .about-box p {
                font-size: 15px;
                line-height: 1.8;
            }

            .previous {
                padding: 9px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <a href="index.html" class="previous">
        &laquo; Previous
    </a>

    <h1>About Us</h1>

    <div class="about-box">
        <p>
            Welcome to our Polo Collection! We offer stylish,
            comfortable, and high-quality polo shirts designed
            for everyday wear and different occasions. Our goal
            is to provide fashionable products that help you
            feel confident and comfortable wherever you go.
        </p>
    </div>

</body>
</html>
