
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 25px 15px;

            background: linear-gradient(135deg, #141e30, #243b55);
            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 45px;

            text-align: center;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 40px;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            overflow-wrap: anywhere;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 30px;
            color: #c3ebb1;
        }

        .logout-btn {
            margin-bottom: 30px;
        }

        .logout-btn a {
            display: inline-block;
            padding: 12px 25px;
            background: #3f3333;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }

        .logout-btn a:hover {
            background: #ff4757;
            transform: translateY(-3px);
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 0;
            margin: 0;
        }

        nav ul li a {
            display: block;
            padding: 14px 22px;
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            background: white;
            color: #243b55;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
        }

        nav i,
        .logout-btn i {
            margin-right: 8px;
        }

        /* Tablet screens */
        @media (max-width: 768px) {
            .container {
                padding: 30px 25px;
            }

            h1 {
                font-size: 32px;
            }

            p {
                font-size: 17px;
                line-height: 1.7;
            }

            nav ul {
                gap: 10px;
            }

            nav ul li a {
                padding: 12px 16px;
            }
        }

        /* Mobile screens */
        @media (max-width: 480px) {
            body {
                padding: 15px 10px;
            }

            .container {
                padding: 25px 15px;
                border-radius: 18px;
            }

            h1 {
                font-size: 26px;
                letter-spacing: 1px;
            }

            p {
                font-size: 15px;
                line-height: 1.7;
            }

            .logout-btn {
                margin-bottom: 25px;
            }

            .logout-btn a {
                padding: 11px 22px;
            }

            nav ul {
                flex-direction: column;
                gap: 10px;
            }

            nav ul li {
                width: 100%;
            }

            nav ul li a {
                width: 100%;
                padding: 13px 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Welcome to Arnel's Page</h1>

        <p>
            Accept the truth that the world is so unfair.<br>
            Keep trying, keep believing, and keep moving forward.<br>
            To make your dream happen.
        </p>

        <div class="logout-btn">
            <a href="Login Form.html">
                <i class="fas fa-sign-out-alt"></i>Logout
            </a>
        </div>

        <nav>
            <ul>
                <li>
                    <a href="index.html">
                        <i class="fas fa-home"></i>Home
                    </a>
                </li>
                <li>
                    <a href="About.html">
                        <i class="fas fa-info-circle"></i>About
                    </a>
                </li>
                <li>
                    <a href="Contact.html">
                        <i class="fas fa-envelope"></i>Contact
                    </a>
                </li>
                <li>
                    <a href="Product.html">
                        <i class="fas fa-box"></i>Product
                    </a>
                </li>
            </ul>
        </nav>

    </div>
</body>
</html>
